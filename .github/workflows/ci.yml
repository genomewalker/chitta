name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  eval-immutable:
    if: github.event_name == 'pull_request' && (startsWith(github.head_ref, 'evolve/') || startsWith(github.head_ref, 'auto/'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Check protected evaluation paths using base policy
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch origin "$HEAD"
          if [[ -f scripts/check-eval-immutable.sh ]]; then
            bash scripts/check-eval-immutable.sh "$BASE" "$HEAD"
          else
            # Initial rollout: no trusted checker exists in the base yet.
            # Require explicit approval; do not execute PR-supplied code.
            git show -s --format=%B "$HEAD" | grep -Eq '^Eval-Change-Approved: [^[:space:]].*$'
          fi

  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Guard against automatic episode pruning
        run: ./scripts/check-no-auto-prune.sh

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.92.0"

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            chitta-field/target
          key: cargo-${{ runner.os }}-${{ hashFiles('chitta-field/Cargo.lock', 'chitta-field/Cargo.toml') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Cache cmake build
        uses: actions/cache@v4
        with:
          path: chitta/build
          key: cmake-chitta-${{ runner.os }}-${{ hashFiles('chitta/CMakeLists.txt', 'chitta/cmake/**', 'chitta/src/**', 'chitta/include/**') }}
          restore-keys: |
            cmake-chitta-${{ runner.os }}-

      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          python-version: "3.11"
          channels: conda-forge

      - name: Install dependencies
        shell: bash -l {0}
        run: |
          conda install -y "python=3.11" cmake nlohmann_json sqlite openblas
          conda install -y -c conda-forge "python=3.11" onnxruntime-cpp
          python --version
          echo "PYO3_PYTHON=$CONDA_PREFIX/bin/python3" >> "$GITHUB_ENV"

      - name: Build chitta-field
        shell: bash -l {0}
        env:
          RUSTFLAGS: "-C target-cpu=x86-64-v2"
        run: |
          cd chitta-field
          ./build.sh build --release

      - name: Build
        shell: bash -l {0}
        run: |
          mkdir -p chitta/build
          cd chitta/build
          cmake .. -DCMAKE_BUILD_TYPE=Release \
            -DPython3_ROOT_DIR="$CONDA_PREFIX" \
            -DPython3_FIND_STRATEGY=LOCATION \
            -DPython3_FIND_VIRTUALENV=ONLY \
            -DPython3_EXECUTABLE="$PYO3_PYTHON"
          cmake --build . -j2

      - name: Verify binaries
        run: |
          ls -la bin/
          test -x bin/chitta
          test -x bin/chittad

      - name: Run tests
        shell: bash -l {0}
        run: |
          cd chitta/build
          ctest --output-on-failure || true

  lint-shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      # Parse check first: a syntax error makes every later result meaningless.
      - name: Parse all shell scripts
        run: |
          rc=0
          while IFS= read -r f; do
            bash -n "$f" || rc=1
          done < <(git ls-files '*.sh')
          exit $rc

      # Config lives in .shellcheckrc (severity floor and the two justified
      # excludes). No `|| true` — this gate is green and must stay green.
      - name: Check shell scripts
        run: shellcheck -x --severity=warning hooks/*.sh scripts/*.sh

  test-hooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Run hook tests
        run: |
          rc=0
          for t in hooks/tests/test_*.sh; do
            echo "::group::$t"
            bash "$t" || rc=1
            echo "::endgroup::"
          done
          exit $rc

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run hook python tests
        run: python3 -m unittest discover -s hooks/tests -p 'test_*.py' -v

      - name: Run SMRITI and eval trust tests
        working-directory: benchmarks/smriti
        run: python3 -m unittest discover tests -v

      - name: Run chitta-mcp tests
        working-directory: chitta-mcp
        run: python3 -m unittest discover tests -v

  lint-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Pinned: an unpinned linter turns an upstream release into a red build
      # on an unrelated PR. Bump deliberately, same as the shellcheck config.
      - name: Install ruff
        run: pip install 'ruff==0.14.10'

      # Config lives in ruff.toml at the repo root. Scope is the Python that
      # ships with the plugin; scripts/ and benchmarks/ fixtures are excluded
      # there. No `|| true` — this gate is green and must stay green.
      - name: Lint
        run: ruff check chitta-mcp hooks benchmarks/smriti benchmarks/noise.py benchmarks/check_eval_immutable.py benchmarks/current_truth scripts/provenance-coverage.py

      - name: Check formatting
        run: ruff format --check chitta-mcp hooks benchmarks/smriti benchmarks/noise.py benchmarks/check_eval_immutable.py benchmarks/current_truth scripts/provenance-coverage.py

      # Catches syntax errors in modules no test imports.
      - name: Byte-compile
        run: python3 -m compileall -q chitta-mcp hooks benchmarks/smriti

      # The MCP SDK is not installed in test-hooks, so the composite-handler
      # snapshot skips there. Install it here so the guard actually runs.
      - name: Install MCP SDK
        # Pinned below 2: server.py uses the 1.x Server decorator API. httpx backs test_http_sessions.
        run: pip install 'mcp>=1.0,<2' httpx

      - name: Composite handler-map snapshot
        working-directory: chitta-mcp
        run: python3 -m unittest tests.test_recall_gateway -v

      # The hooks and the standalone chitta-mcp modules run under
      # `#!/usr/bin/env python3`, which on the deployment hosts is 3.9. That is
      # the real floor, so it gets a real interpreter here.
      - name: Set up the 3.9 deployment floor
        id: py39
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      # compileall is NOT sufficient: `dict | None` in an annotation parses on
      # 3.9 and only raises TypeError when the module is imported. Missing
      # third-party deps are expected here and are reported, not failed on;
      # a SyntaxError or TypeError is a genuine version regression.
      - name: Import smoke test on the 3.9 floor
        run: |
          "${{ steps.py39.outputs.python-path }}" - <<'SMOKE'
          import importlib.util, pathlib, sys

          sys.path.insert(0, "chitta-mcp")
          targets = [p for p in sorted(pathlib.Path("chitta-mcp").rglob("*.py"))
                     if "__pycache__" not in str(p) and p.name != "tools_static.py"]
          targets += sorted(pathlib.Path("hooks").glob("*.py"))
          sys.path.insert(0, "benchmarks/smriti")
          targets += sorted(pathlib.Path("benchmarks/smriti").glob("*.py"))
          targets += [pathlib.Path("benchmarks/noise.py"), pathlib.Path("benchmarks/check_eval_immutable.py")]

          failures, skipped = [], []
          for path in targets:
              name = "smoke_" + path.stem.replace("-", "_")
              spec = importlib.util.spec_from_file_location(name, path)
              module = importlib.util.module_from_spec(spec)
              sys.modules[name] = module
              try:
                  spec.loader.exec_module(module)
              except SystemExit:
                  pass
              except (SyntaxError, TypeError) as exc:
                  failures.append("%s: %s: %s" % (path, type(exc).__name__, exc))
              except BaseException as exc:
                  skipped.append("%s (%s)" % (path, type(exc).__name__))

          try:
              import soul_repl  # noqa: F401  — package import, not reachable by file path
          except (SyntaxError, TypeError) as exc:
              failures.append("soul_repl: %s: %s" % (type(exc).__name__, exc))
          except BaseException as exc:
              skipped.append("soul_repl (%s)" % type(exc).__name__)

          print("checked %d modules on %s" % (len(targets), sys.version.split()[0]))
          for s in skipped:
              print("  skipped (missing dep or import-time side effect): " + s)
          if failures:
              print("PYTHON-VERSION FAILURES (3.10+ syntax in code that runs on 3.9):")
              for f in failures:
                  print("  " + f)
              sys.exit(1)
          print("all modules import on the 3.9 floor")
          SMOKE

  # The published site and the docs are gated like code: every local link and
  # anchor resolves, every citation is in the per-page References and the
  # index, and the site structure checker (when present) passes. Stdlib only.
  docs-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Links and anchors
        run: bash scripts/check-docs-links.sh

      - name: Citations
        run: bash scripts/check-citations.sh

      - name: Site structure
        run: |
          if [ -f scripts/check-site.py ]; then python3 scripts/check-site.py; else echo "check-site.py not present yet"; fi
