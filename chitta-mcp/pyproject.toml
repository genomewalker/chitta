[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chitta-mcp"
version = "5.62.3"
description = "MCP server for chitta soul memory daemon"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
]

[project.optional-dependencies]
model = [
    "optimum[onnxruntime]>=1.20.0",
    "transformers>=4.40.0",
]

[project.scripts]
chitta-mcp = "server:main"
chitta-mcp-install = "install:install"
chitta-mcp-uninstall = "install:uninstall"
chitta-mcp-sync = "sync_tools:sync"
chitta-stack = "stack:main"

[tool.setuptools]
py-modules = ["server", "install", "sync_tools", "tools_static", "stack"]
